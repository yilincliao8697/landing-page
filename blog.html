<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Yilin Catherine Liao</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #fafafa;
      --surface:  #ffffff;
      --border:   #e5e5e5;
      --text:     #1a1a1a;
      --muted:    #6b7280;
      --accent:   #2563eb;
      --accent-h: #1d4ed8;
      --radius:   8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 80px 24px 60px;
      flex: 1;
    }

    /* ── Nav ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 48px;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--accent); }

    /* ── Hero ── */
    .hero { margin-bottom: 48px; }

    .hero h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 1rem;
      color: var(--muted);
    }

    /* ── Section ── */
    section h2 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ── Posts ── */
    .posts { display: flex; flex-direction: column; gap: 12px; }

    .post-card {
      display: block;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .post-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
    }

    .post-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 12px;
    }

    .post-title {
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .post-date {
      font-size: 0.8125rem;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .post-desc {
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* ── Empty state ── */
    .empty {
      padding: 40px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.9375rem;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.8125rem;
      color: var(--border);
    }
  </style>
</head>
<body>
  <main>

    <a class="back-link" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </a>

    <div class="hero">
      <h1>Blog</h1>
      <p>Thoughts on AI engineering, tooling, and building things.</p>
    </div>

    <section>
      <h2>Posts</h2>
      <div class="posts">

        <!-- Add post cards here. Example:
        <a class="post-card" href="posts/my-first-post.html">
          <div class="post-header">
            <span class="post-title">My First Post</span>
            <span class="post-date">2026-04-06</span>
          </div>
          <p class="post-desc">A short description of what this post is about.</p>
        </a>
        -->
        <a class="post-card" href="posts/blog-purpose.html">
          <div class="post-header">
            <span class="post-title">Blog Purpose</span>
            <span class="post-date">2026-04-06</span>
          </div>
          <p class="post-desc">Why this blog site was created and plans for it</p>
        </a>

        <div class="empty">No posts yet — check back soon.</div>

      </div>
    </section>

  </main>

  <footer>© 2026 Yilin Catherine Liao</footer>
</body>
</html>
